<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traeger Monitor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <header>
        <h1>Traeger Monitor</h1>
        <select id="time-range" onchange="updateChart()">
            <option value="1">Last Hour</option>
            <option value="3">Last 3 Hours</option>
            <option value="6">Last 6 Hours</option>
            <option value="12">Last 12 Hours</option>
            <option value="24">Last 24 Hours</option>
        </select>
    </header>
    
    <div class="temps-grid">
        <div class="temp-card">
            <h3>Grill</h3>
            <div class="temp" id="grill-temp">--</div>
            <div class="target">Target: <span id="grill-set">--</span>°F</div>
        </div>
        <div class="temp-card">
            <h3>Ambient</h3>
            <div class="temp" id="ambient-temp">--</div>
            <div class="target">Pellets: <span id="pellet-level">--</span>%</div>
        </div>
    </div>
    
    <div id="probe-cards" class="temps-grid"></div>
    
    <div id="chart"></div>
    
    <script src="app.js"></script>
</body>
</html>
