[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    --verbose
    --cov=traeger_client
    --cov=streaming
    --cov-report=term-missing
    --cov-report=html
    --strict-markers
markers =
    asyncio: marks tests as async (auto-detected)
    integration: marks tests as integration tests
    slow: marks tests as slow running